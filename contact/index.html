<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Contact your DJ | DJ_BeatChic</title>
    <meta
      name="description"
      content="Contact DJ Beatchic by phone, SMS, or WhatsApp."
    />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=Space+Grotesk:wght@600;700&display=swap"
      rel="stylesheet"
    />
    <style>
      :root {
        --bg-base: #07150f;
        --bg-panel: rgba(10, 22, 17, 0.82);
        --bg-card: rgba(15, 32, 25, 0.88);
        --emerald: #00ff88;
        --emerald-soft: rgba(0, 255, 136, 0.18);
        --teal: #69ffe0;
        --text: #f5fff9;
        --muted: rgba(230, 255, 244, 0.72);
        --line: rgba(255, 255, 255, 0.12);
      }

      * {
        box-sizing: border-box;
      }

      html, body {
        margin: 0;
        min-height: 100%;
        font-family: "Plus Jakarta Sans", Arial, sans-serif;
        background: var(--bg-base);
        color: var(--text);
      }

      body {
        min-height: 100vh;
        display: grid;
        place-items: center;
        padding: 28px 18px;
        background:
          linear-gradient(rgba(7, 21, 15, 0.7), rgba(7, 21, 15, 0.72)),
          url("../1.png") center/cover no-repeat fixed;
      }

      .contact-shell {
        width: min(100%, 420px);
        position: relative;
        z-index: 1;
      }

      .card {
        background: rgba(8, 18, 14, 0.72);
        border: 1px solid rgba(255, 255, 255, 0.1);
        border-radius: 24px;
        padding: 22px 18px 18px;
        box-shadow: 0 30px 80px rgba(0, 0, 0, 0.4), 0 0 28px rgba(0, 255, 136, 0.14);
        backdrop-filter: blur(18px);
        -webkit-backdrop-filter: blur(18px);
      }

      .brand {
        display: flex;
        align-items: center;
        justify-content: center;
        gap: 10px;
        margin-bottom: 22px;
        text-align: center;
      }

      .brand-name {
        font-family: "Space Grotesk", Arial, sans-serif;
        font-size: 1.05rem;
        letter-spacing: 0.16em;
        text-transform: uppercase;
        color: var(--text);
      }

      .phone-wrap {
        display: flex;
        justify-content: center;
      }

      .phone-link {
        display: inline-block;
        text-decoration: none;
        color: var(--text);
        font-size: clamp(2rem, 7vw, 3rem);
        font-weight: 800;
        letter-spacing: -0.06em;
        line-height: 1.1;
        text-align: center;
        margin: 0 0 18px;
        background: linear-gradient(135deg, #f2fff8 15%, var(--teal) 55%, var(--emerald) 100%);
        -webkit-background-clip: text;
        background-clip: text;
        color: transparent;
        text-shadow: 0 0 16px rgba(0, 255, 136, 0.15);
      }

      .actions {
        display: grid;
        gap: 12px;
      }

      .action-btn {
        display: inline-flex;
        align-items: center;
        justify-content: center;
        gap: 10px;
        min-height: 56px;
        padding: 14px 18px;
        border-radius: 16px;
        border: 1px solid rgba(255, 255, 255, 0.12);
        text-decoration: none;
        font-weight: 700;
        transition: transform 0.2s ease, box-shadow 0.2s ease, border-color 0.2s ease;
      }

      .action-btn:hover,
      .action-btn:active {
        transform: translateY(-1px);
      }

      .action-btn svg {
        display: block;
        width: 1.2rem;
        height: 1.2rem;
        flex-shrink: 0;
      }

      .phone-btn {
        background: rgba(255, 255, 255, 0.04);
        color: var(--text);
        border-color: rgba(0, 255, 136, 0.18);
      }

      .whatsapp-btn {
        background: linear-gradient(135deg, rgba(76, 255, 145, 0.18), rgba(0, 255, 136, 0.12));
        color: var(--text);
        border-color: rgba(0, 255, 136, 0.4);
        box-shadow: 0 0 18px rgba(0, 255, 136, 0.14);
      }

      .sms-btn {
        background: rgba(0, 255, 136, 0.08);
        color: var(--text);
        border-color: rgba(105, 255, 224, 0.28);
      }

      .instagram-btn {
        background: linear-gradient(135deg, rgba(255, 99, 132, 0.18), rgba(255, 168, 0, 0.12));
        color: var(--text);
        border-color: rgba(255, 255, 255, 0.18);
        box-shadow: 0 0 18px rgba(255, 105, 180, 0.12);
      }

      .icon {
        font-size: 1.2rem;
        line-height: 1;
      }

      .site-link {
        display: block;
        text-align: center;
        margin-top: 18px;
        color: var(--muted);
        letter-spacing: 0.08em;
        text-transform: uppercase;
        font-size: 0.72rem;
        text-decoration: none;
      }

      @media (max-width: 360px) {
        .card {
          padding-left: 14px;
          padding-right: 14px;
        }

        .brand-name {
          letter-spacing: 0.12em;
          font-size: 0.9rem;
        }
      }
    </style>
  </head>
  <body>
    <main class="contact-shell" aria-label="Contact DJ Beatchic">
      <section class="card">
        <div class="brand">
          <div class="brand-name">Contact your DJ</div>
        </div>

        <div class="phone-wrap">
          <a class="phone-link" href="tel:+18603138477">+1.860-313-8477</a>
        </div>

        <div class="actions">
          <a class="action-btn phone-btn" href="tel:+18603138477">
            <span class="icon">📞</span>
            <span>Call Now</span>
          </a>

          <a
            class="action-btn sms-btn"
            href="sms:+18603138477?body=Hi!%20I'm%20interested%20in%20booking%20DJ%20Beatchic%20for%20an%20upcoming%20event.%20Are%20you%20available%20on"
            target="_blank"
            rel="noopener noreferrer"
          >
            <span class="icon">💬</span>
            <span>Text Now</span>
          </a>

          <a
            class="action-btn whatsapp-btn"
            href="https://wa.me/18603138477?text=Hi!%20I'm%20interested%20in%20booking%20DJ%20Beatchic%20for%20an%20upcoming%20event.%20Are%20you%20available%20on"
            target="_blank"
            rel="noopener noreferrer"
          >
            <span class="icon" aria-hidden="true">
              <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 448 512" aria-hidden="true">
                <path fill="currentColor" d="M380.9 97.1C339 55.1 283.2 32 223.9 32c-122.4 0-222 99.6-222 222 0 39.1 10.2 77.3 29.6 111L0 480l117.7-30.9c32.4 17.7 68.9 27 106.1 27h.1c122.3 0 224.1-99.6 224.1-222 0-59.2-23.1-114.7-64.9-156.6ZM223.9 409.1c-32.9 0-65.2-8.7-92.9-25.1l-6.7-4-69.8 18.3 18.7-68.1-4.4-7c-18-31.7-27.4-68.3-27.4-105.2 0-106.5 86.7-193.2 193.5-193.2 51.7 0 100.2 20.2 136.7 56.7 36.4 36.6 56.6 85.1 56.6 136.8-.1 106.7-86.8 193.3-193.5 193.3Zm106.2-144.5c-5.8-2.9-34.3-16.9-39.6-18.8-5.2-1.9-9-2.9-12.8 2.9-3.8 5.8-14.7 18.8-18 22.6-3.3 3.8-6.6 4.3-12.4 1.4-5.8-2.9-24.4-9-46.4-28.7-17.2-15.3-28.8-34.1-32.2-39.9-3.4-5.8-.4-8.9 2.5-11.8 2.6-2.6 5.7-6.6 8.6-9.9 2.9-3.3 3.8-5.8 5.8-9.7 1.9-3.9.9-7.3-.5-10.2-1.4-2.9-12.8-30.8-17.5-42.2-4.6-11.1-9.3-9.6-12.8-9.8-3.3-.2-7.1-.2-10.9-.2s-10.2 1.5-15.4 7.3c-5.2 5.8-19.8 19.4-19.8 47.3s20.3 54.8 23.1 58.6c2.9 3.8 39.9 61.1 96.6 85.8 13.5 5.8 24 9.3 32.2 11.9 13.6 4.3 26 3.7 35.8 2.2 10.9-1.6 34.3-14 39.2-27.6 4.9-13.6 4.9-25.2 3.4-27.6-1.5-2.4-5.2-3.8-10.9-6.7Z"/>
              </svg>
            </span>
            <span>WhatsApp</span>
          </a>

          <a
            href="https://instagram.com/dj_beatchic"
            class="action-btn instagram-btn"
            target="_blank"
            rel="noopener noreferrer"
            aria-label="Follow DJ Beatchic on Instagram"
          >
            <svg class="instagram-icon" viewBox="0 0 24 24" fill="currentColor" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">
              <path d="M7 2h10a5 5 0 0 1 5 5v10a5 5 0 0 1-5 5H7a5 5 0 0 1-5-5V7a5 5 0 0 1 5-5Zm0 2a3 3 0 0 0-3 3v10a3 3 0 0 0 3 3h10a3 3 0 0 0 3-3V7a3 3 0 0 0-3-3H7Zm5 3.5A4.5 4.5 0 1 1 7.5 12 4.5 4.5 0 0 1 12 7.5Zm0 2A2.5 2.5 0 1 0 14.5 12 2.5 2.5 0 0 0 12 9.5Zm5-3.25a1.25 1.25 0 1 1-1.25 1.25A1.25 1.25 0 0 1 17 6.25Z"/>
            </svg>
            <span>Follow on Instagram</span>
          </a>
        </div>
      </section>
    </main>
  </body>
</html>
