<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Contact your DJ | DJ_BeatChic</title>
    <meta
      name="description"
      content="Contact DJ Beatchic by phone, SMS, or WhatsApp."
    />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=Space+Grotesk:wght@600;700&display=swap"
      rel="stylesheet"
    />
    <style>
      :root {
        --bg-base: #07150f;
        --bg-panel: rgba(10, 22, 17, 0.82);
        --bg-card: rgba(15, 32, 25, 0.88);
        --emerald: #00ff88;
        --emerald-soft: rgba(0, 255, 136, 0.18);
        --teal: #69ffe0;
        --text: #f5fff9;
        --muted: rgba(230, 255, 244, 0.72);
        --line: rgba(255, 255, 255, 0.12);
      }

      * {
        box-sizing: border-box;
      }

      html, body {
        margin: 0;
        min-height: 100%;
        font-family: "Plus Jakarta Sans", Arial, sans-serif;
        background: var(--bg-base);
        color: var(--text);
      }

      body {
        min-height: 100vh;
        display: grid;
        place-items: center;
        padding: 28px 18px;
        background:
          linear-gradient(rgba(7, 21, 15, 0.7), rgba(7, 21, 15, 0.72)),
          url("../1.png") center/cover no-repeat fixed;
      }

      .contact-shell {
        width: min(100%, 420px);
        position: relative;
        z-index: 1;
      }

      .card {
        background: rgba(8, 18, 14, 0.72);
        border: 1px solid rgba(255, 255, 255, 0.1);
        border-radius: 24px;
        padding: 22px 18px 18px;
        box-shadow: 0 30px 80px rgba(0, 0, 0, 0.4), 0 0 28px rgba(0, 255, 136, 0.14);
        backdrop-filter: blur(18px);
        -webkit-backdrop-filter: blur(18px);
      }

      .brand {
        display: flex;
        align-items: center;
        justify-content: center;
        gap: 10px;
        margin-bottom: 22px;
        text-align: center;
      }

      .brand-name {
        font-family: "Space Grotesk", Arial, sans-serif;
        font-size: 1.05rem;
        letter-spacing: 0.16em;
        text-transform: uppercase;
        color: var(--text);
      }

      .phone-wrap {
        display: flex;
        justify-content: center;
      }

      .phone-link {
        display: inline-block;
        text-decoration: none;
        color: var(--text);
        font-size: clamp(2rem, 7vw, 3rem);
        font-weight: 800;
        letter-spacing: -0.06em;
        line-height: 1.1;
        text-align: center;
        margin: 0 0 18px;
        background: linear-gradient(135deg, #f2fff8 15%, var(--teal) 55%, var(--emerald) 100%);
        -webkit-background-clip: text;
        background-clip: text;
        color: transparent;
        text-shadow: 0 0 16px rgba(0, 255, 136, 0.15);
      }

      .actions {
        display: grid;
        gap: 12px;
      }

      .action-btn {
        display: inline-flex;
        align-items: center;
        justify-content: center;
        gap: 10px;
        min-height: 56px;
        padding: 14px 18px;
        border-radius: 16px;
        border: 1px solid rgba(255, 255, 255, 0.12);
        text-decoration: none;
        font-weight: 700;
        transition: transform 0.2s ease, box-shadow 0.2s ease, border-color 0.2s ease;
      }

      .action-btn:hover,
      .action-btn:active {
        transform: translateY(-1px);
      }

      .phone-btn {
        background: rgba(255, 255, 255, 0.04);
        color: var(--text);
        border-color: rgba(0, 255, 136, 0.18);
      }

      .whatsapp-btn {
        background: linear-gradient(135deg, rgba(76, 255, 145, 0.18), rgba(0, 255, 136, 0.12));
        color: var(--text);
        border-color: rgba(0, 255, 136, 0.4);
        box-shadow: 0 0 18px rgba(0, 255, 136, 0.14);
      }

      .sms-btn {
        background: rgba(0, 255, 136, 0.08);
        color: var(--text);
        border-color: rgba(105, 255, 224, 0.28);
      }

      .icon {
        font-size: 1.2rem;
        line-height: 1;
      }

      .site-link {
        display: block;
        text-align: center;
        margin-top: 18px;
        color: var(--muted);
        letter-spacing: 0.08em;
        text-transform: uppercase;
        font-size: 0.72rem;
        text-decoration: none;
      }

      @media (max-width: 360px) {
        .card {
          padding-left: 14px;
          padding-right: 14px;
        }

        .brand-name {
          letter-spacing: 0.12em;
          font-size: 0.9rem;
        }
      }
    </style>
  </head>

        </div>

        </div>

            rel="noopener noreferrer"

</html>
